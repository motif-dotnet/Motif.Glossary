name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The top-level docs aren't part of the site, so a change to them alone needn't test or deploy it.
    paths-ignore: ["*.md"]
  pull_request:
    paths-ignore: ["*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Motif.Glossary.sln -c Release

      # The specs first: they take a second, so a broken one fails the run before the browser specs start.
      - name: Specs
        run: >
          dotnet test Checks/Motif.Glossary.Specs -c Release --no-build
          --logger "trx;LogFileName=specs.trx" --results-directory results

      # Not --no-build: without its build, publish leaves index.html's fingerprint placeholders unfilled.
      - name: Publish
        run: dotnet publish Motif.Glossary.App -c Release -o publish

      # The browser specs serve what was just published (MOTIF_SITE), so the app is published once, and
      # they use the Edge the runner image comes with.
      - name: Browser specs
        env:
          MOTIF_SITE: ${{ github.workspace }}/publish
        run: >
          dotnet test Checks/Motif.Glossary.BrowserSpecs -c Release --no-build
          --logger "trx;LogFileName=browser-specs.trx" --results-directory results

      # How many specs there are and how long they take, on the run's page, to keep an eye on as they grow.
      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $ms = { param($time) if ($time) { [int]([timespan]$time).TotalMilliseconds } else { 0 } }
          $lines = @('### Specs', '', '| | Passed | Failed | Skipped | The specs took | The run took |', '|---|---|---|---|---|---|')
          $all = @()
          foreach ($file in Get-ChildItem results -Filter *.trx -ErrorAction SilentlyContinue) {
            $run = ([xml](Get-Content $file.FullName)).TestRun
            $counts = $run.ResultSummary.Counters
            $specs = @($run.Results.UnitTestResult)
            $all += $specs
            $total = ($specs | ForEach-Object { & $ms $_.duration } | Measure-Object -Sum).Sum
            $whole = & $ms ([datetime]$run.Times.finish - [datetime]$run.Times.start)
            $lines += "| $($file.BaseName) | $($counts.passed) | $($counts.failed) | $($counts.notExecuted) | $total ms | $whole ms |"
          }
          $lines += '', '| Slowest | Time |', '|---|---|'
          $lines += $all | Sort-Object { [timespan]$_.duration } -Descending | Select-Object -First 5 |
            ForEach-Object { "| ``$($_.testName)`` | $(& $ms $_.duration) ms |" }
          $lines | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # A project site lives under /<repository>/, and Jekyll must leave _framework alone.
      - name: Prepare for Pages
        run: |
          base="/${GITHUB_REPOSITORY#*/}/"
          sed -i "s|<base href=\"/\" />|<base href=\"$base\" />|" publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll
          cp publish/wwwroot/index.html publish/wwwroot/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot
          # Keep the .nojekyll made above: from v4 the action leaves dotfiles out.
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
